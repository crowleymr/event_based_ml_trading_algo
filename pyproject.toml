[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "trading-pipeline"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["polars>=1.30,<2", "duckdb>=1.2,<2", "pyarrow>=19", "scikit-learn>=1.6,<2", "scipy>=1.13,<2", "yfinance>=0.2.65,<1", "requests>=2.32", "PyYAML>=6", "matplotlib>=3.9", "joblib>=1.4"]

[project.optional-dependencies]
test = ["pytest>=8"]
rl = ["gymnasium>=1.0,<2", "stable-baselines3>=2.6,<3", "torch>=2.5"]
dashboard = ["streamlit>=1.42,<2", "pandas>=2.2"]
notebook = ["jupyterlab>=4.3,<5", "nbconvert>=7.16,<8", "ipykernel>=6.29,<7"]
xgboost = ["xgboost>=3.1,<4"]
phase2 = [
    "gymnasium>=1.0,<2",
    "stable-baselines3>=2.6,<3",
    "torch>=2.5",
    "streamlit>=1.42,<2",
    "pandas>=2.2",
    "xgboost>=3.1,<4",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
